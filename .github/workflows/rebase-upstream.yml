name: Rebase on upstream

on:
  schedule:
    # Every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/llm-prioritization
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and rebase
        run: |
          git remote add upstream https://github.com/linuxserver/docker-radarr.git || true
          git fetch upstream master
          git rebase upstream/master

      - name: Push (force with lease)
        run: git push --force-with-lease origin feature/llm-prioritization
